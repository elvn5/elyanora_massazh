name: Deploy
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
permissions:
  contents: read
concurrency:
  group: production
  cancel-in-progress: false
jobs:
  publish:
    timeout-minutes: 20
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      owner: ${{ steps.names.outputs.owner }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - id: names
        run: echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: backend/Dockerfile
          push: true
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          tags: ghcr.io/${{ steps.names.outputs.owner }}/masajka-api:${{ github.event.workflow_run.head_sha }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: frontend/Dockerfile
          push: true
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          tags: ghcr.io/${{ steps.names.outputs.owner }}/masajka-web:${{ github.event.workflow_run.head_sha }}
  deploy:
    needs: publish
    if: vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
      - name: Deploy verified images
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          IMAGE_OWNER: ${{ needs.publish.outputs.owner }}
          IMAGE_SHA: ${{ github.event.workflow_run.head_sha }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          GHCR_READ_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [[ ! "$TELEGRAM_BOT_TOKEN" =~ ^[0-9]+:[A-Za-z0-9_-]+$ ]]; then
            echo 'Set the TELEGRAM_BOT_TOKEN GitHub Secret before deployment.' >&2
            exit 1
          fi
          # A secret pasted in the GitHub UI often ends with a line break.
          while [[ "$ADMIN_PASSWORD" == *$'\n' || "$ADMIN_PASSWORD" == *$'\r' ]]; do ADMIN_PASSWORD=${ADMIN_PASSWORD%?}; done
          admin_length=$(LC_ALL=C; printf '%s' "${#ADMIN_PASSWORD}")
          admin_problem=''
          if [ "$admin_length" -eq 0 ]; then admin_problem='it is empty or not set'
          elif [ "$admin_length" -lt 12 ]; then admin_problem='it is shorter than 12 bytes'
          elif [ "$admin_length" -gt 72 ]; then admin_problem='it is longer than 72 bytes (Cyrillic letters take 2 bytes)'
          elif [[ "$ADMIN_PASSWORD" == *"'"* ]]; then admin_problem='it contains a single quote'
          elif [[ "$ADMIN_PASSWORD" =~ [[:cntrl:]] ]]; then admin_problem='it contains a line break, tab or other control character'
          fi
          if [ -n "$admin_problem" ]; then
            echo "The ADMIN_PASSWORD GitHub Secret is invalid: $admin_problem. Use 12-72 bytes, no single quotes or line breaks." >&2
            exit 1
          fi
          server() { ssh -T "${DEPLOY_USER}@${DEPLOY_HOST}" "$@"; }
          release() {
            server compose < compose.yaml
            printf '%s\n' "$GHCR_READ_TOKEN" | server "deploy $IMAGE_SHA"
          }
          printf '%s\n' "$TELEGRAM_BOT_TOKEN" | server token
          if ! reply=$(printf '%s\n' "$ADMIN_PASSWORD" | server admin-password 2>&1); then
            # A server gateway older than the admin-password command: this release's
            # deploy-tools service installs the current scripts, then the password is applied.
            if [[ "$reply" != *'Only token, compose and deploy'* ]]; then
              echo "$reply" >&2
              exit 1
            fi
            echo 'Server deploy scripts are outdated; updating them through this release.'
            release
            printf '%s\n' "$ADMIN_PASSWORD" | server admin-password
          fi
          release
      - name: Remove key
        if: always()
        run: rm -f ~/.ssh/id_ed25519
