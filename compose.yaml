name: masajka
services:
  db:
    mem_limit: 512m
    cpus: 1.0
    logging: &logging
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: masajka
      POSTGRES_USER: masajka
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U masajka -d masajka']
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
  api:
    mem_limit: 256m
    cpus: 1.0
    logging: *logging
    image: ${API_IMAGE:-masajka-api:local}
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: postgres://masajka:${POSTGRES_PASSWORD}@db:5432/masajka?sslmode=disable
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD with at least 12 characters}
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:8088}
      SALON_TIMEZONE: ${SALON_TIMEZONE:-Asia/Bishkek}
      CURRENCY: ${CURRENCY:-KGS}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_BOOKINGS_CHAT_ID: ${TELEGRAM_BOOKINGS_CHAT_ID:--1003761508539}
      TELEGRAM_BOOKINGS_THREAD_ID: ${TELEGRAM_BOOKINGS_THREAD_ID:-2}
    depends_on:
      db: {condition: service_healthy}
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, 'http://127.0.0.1:8080/api/health']
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
  web:
    mem_limit: 128m
    cpus: 0.5
    logging: *logging
    image: ${WEB_IMAGE:-masajka-web:local}
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - '${WEB_BIND:-127.0.0.1}:${WEB_PORT:-8088}:80'
    depends_on:
      api: {condition: service_healthy}
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, 'http://127.0.0.1/api/health']
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
volumes:
  postgres_data:
